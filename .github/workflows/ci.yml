name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install (CPU-only torch)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[llm,dev]"
      - name: Lint
        run: ruff check .
      - name: Tests (synthetic data, tiny random model, no GPU, no network)
        run: pytest -q
      - name: README tables match results/
        run: python report/make_report.py --check
